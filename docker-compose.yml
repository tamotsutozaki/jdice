name: jdice

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jdice}
      POSTGRES_USER: ${POSTGRES_USER:-jdice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jdice}
    ports:
      # 5433 no host de propósito: 5432 costuma já estar ocupada por uma
      # instalação nativa do Postgres, e o conflito é silencioso — a conexão
      # cai no servidor errado em vez de falhar.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jdice} -d ${POSTGRES_DB:-jdice}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Servidor SMTP de captura para desenvolvimento: aceita as mensagens e as
  # mostra numa interface web, sem entregar a ninguém. Permite validar o envio
  # de ponta a ponta sem risco de mandar e-mail para pessoas reais.
  mailpit:
    image: axllent/mailpit:v1.21
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reparte as entregas de um disparo entre os workers. O Hangfire decide
  # quando o disparo sai; a fila decide quantos processam ao mesmo tempo.
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-jdice}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-jdice}
    ports:
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/Jdice.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-jdice};Username=${POSTGRES_USER:-jdice};Password=${POSTGRES_PASSWORD:-jdice}"
      # O front é servido pelo nginx na mesma origem, então CORS fica vazio aqui.
      # Só é preenchido quando se roda `ng serve` contra a API do compose.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:4200}

      # Sem default de propósito: um segredo com valor padrão vira o segredo de
      # produção de quem esqueceu de configurar. O compose recusa subir sem ele.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no .env (minimo 32 bytes)}

      # Administrador inicial, criado apenas se o banco não tiver nenhuma conta.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}

      # Envio: Mailpit (captura, padrão) ou Azure. Só troque EMAIL_PROVIDER para
      # "Azure" e preencha ACS_* no .env para mandar de verdade.
      Email__Provider: ${EMAIL_PROVIDER:-Mailpit}
      Acs__ConnectionString: ${ACS_CONNECTION_STRING:-}
      Acs__SenderAddress: ${ACS_SENDER_ADDRESS:-}

      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-nao-responda@jdice.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-JDice}

      RabbitMq__Enabled: ${RABBITMQ_ENABLED:-true}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-jdice}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-jdice}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # Processa os disparos. Separado da API para poder escalar sozinho:
  #   docker compose up --scale worker=3
  worker:
    build:
      context: .
      dockerfile: src/Jdice.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-jdice};Username=${POSTGRES_USER:-jdice};Password=${POSTGRES_PASSWORD:-jdice}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no .env (minimo 32 bytes)}
      # É o worker que envia de fato; estas variáveis precisam chegar aqui.
      Email__Provider: ${EMAIL_PROVIDER:-Mailpit}
      Acs__ConnectionString: ${ACS_CONNECTION_STRING:-}
      Acs__SenderAddress: ${ACS_SENDER_ADDRESS:-}

      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-nao-responda@jdice.local}
      Smtp__FromName: ${SMTP_FROM_NAME:-JDice}
      Hangfire__WorkerCount: ${WORKER_COUNT:-4}

      RabbitMq__Enabled: ${RABBITMQ_ENABLED:-true}
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: ${RABBITMQ_USER:-jdice}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-jdice}
      RabbitMq__Prefetch: ${RABBITMQ_PREFETCH:-10}
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      # Espera a API porque é ela que aplica as migrations; o worker apenas
      # aguarda as tabelas existirem.
      api:
        condition: service_started

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
