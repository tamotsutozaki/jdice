name: jdice

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jdice}
      POSTGRES_USER: ${POSTGRES_USER:-jdice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jdice}
    ports:
      # 5433 no host de propósito: 5432 costuma já estar ocupada por uma
      # instalação nativa do Postgres, e o conflito é silencioso — a conexão
      # cai no servidor errado em vez de falhar.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jdice} -d ${POSTGRES_DB:-jdice}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: src/Jdice.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-jdice};Username=${POSTGRES_USER:-jdice};Password=${POSTGRES_PASSWORD:-jdice}"
      # O front é servido pelo nginx na mesma origem, então CORS fica vazio aqui.
      # Só é preenchido quando se roda `ng serve` contra a API do compose.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:4200}

      # Sem default de propósito: um segredo com valor padrão vira o segredo de
      # produção de quem esqueceu de configurar. O compose recusa subir sem ele.
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY no .env (minimo 32 bytes)}

      # Administrador inicial, criado apenas se o banco não tiver nenhuma conta.
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-5080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  web:
    build:
      context: ./web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
