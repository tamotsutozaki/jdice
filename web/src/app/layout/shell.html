<div class="app">
  <aside class="sidebar">
    <a class="sidebar-brand" routerLink="/" [title]="marca.nome">
      <span class="sidebar-logo">{{ marca.sigla }}</span>
      <span class="sidebar-brand-text">
        <span class="brand-name">{{ marca.nome }}</span>
        <span class="brand-sub">{{ marca.subtitulo }}</span>
      </span>
    </a>

    <nav class="sidebar-nav">
      @for (item of navegacao(); track item.rota) {
        <a
          class="sidebar-item"
          [routerLink]="item.rota"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exata }"
        >
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            [innerHTML]="icone(item.icone)"
          ></svg>
          <span class="sidebar-label">{{ item.rotulo }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-spacer"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      @if (usuario(); as u) {
        <div class="topbar-user">
          <a class="user-info" routerLink="/perfil" title="Meu perfil">
            <div class="user-name">{{ u.email }}</div>
            <div class="user-role">{{ perfil() }}</div>
          </a>
          <a class="user-avatar" routerLink="/perfil" title="Meu perfil">{{ iniciais() }}</a>
          <button class="logout-btn" type="button" (click)="sair()" [disabled]="saindo()">
            Sair
          </button>
        </div>
      }
    </header>

    <main class="content">
      <router-outlet />
    </main>

    <footer class="footer">{{ marca.rodape }} © 2026</footer>
  </div>
</div>
