<main class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="entrar()">
    <header>
      <h1>JDice</h1>
      <p>Entre para gerenciar seus disparos</p>
    </header>

    @if (erro()) {
      <p class="erro" role="alert">{{ erro() }}</p>
    }

    <label>
      <span>E-mail</span>
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        placeholder="voce@empresa.com"
      />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small>Informe um e-mail válido.</small>
      }
    </label>

    <label>
      <span>Senha</span>
      <input type="password" formControlName="senha" autocomplete="current-password" />
      @if (form.controls.senha.touched && form.controls.senha.invalid) {
        <small>Informe sua senha.</small>
      }
    </label>

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>
</main>
