<main class="status">
  <header>
    <div>
      <h1>JDice</h1>
      <p>Gerenciador de disparo de e-mails corporativos</p>
    </div>

    @if (user(); as usuario) {
      <div class="sessao">
        <span class="email">{{ usuario.email }}</span>
        <span class="papel" [class.admin]="isAdmin()">{{ usuario.role }}</span>
        <button type="button" (click)="sair()" [disabled]="saindo()">Sair</button>
      </div>
    }
  </header>

  @if (isAdmin()) {
    <!-- Só para administradores: o endpoint recusa os demais, e oferecer o
         link a quem seria barrado pelo guard é um beco sem saída. -->
    <nav class="acoes">
      <a routerLink="/usuarios/novo">Cadastrar usuário</a>
    </nav>
  }

  <section class="checks">
    <div class="check" [class]="live()">
      <span class="name">API</span>
      <span class="state">{{ label(live()) }}</span>
    </div>

    <div class="check" [class]="ready()">
      <span class="name">Banco de dados</span>
      <span class="state">{{ label(ready()) }}</span>
    </div>
  </section>

  <footer>Fase 1 — autenticação. Modelos de e-mail entram na Fase 2.</footer>
</main>
